<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- The vessel as a compass puck. The disc is centred on the viewBox centre
       (32,32), which QGIS uses as the marker anchor and pivot, so rotating the
       marker by the bearing turns the needle and leaves the disc unchanged. -->
  <circle cx="32" cy="32" r="26"
          fill="param(fill) #dc3232" fill-opacity="0.95"
          stroke="param(outline) #8c1414" stroke-width="3"/>

  <!-- needle, pointing north at angle 0 -->
  <path d="M32,11 L45,45 L32,37 L19,45 Z"
        fill="#ffffff" fill-opacity="0.95"
        stroke="param(outline) #8c1414" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
